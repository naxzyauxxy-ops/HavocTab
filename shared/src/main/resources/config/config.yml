# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Header-&-Footer
header-footer:
  enabled: true
  designs:
    world-test:
      display-condition: "%world%=test"
      header:
        - "Test header in world 'test'"
      footer:
        - "Test footer in world 'test'"
    default:
      header:
        - "<#FFFFFF>&m                                                </#FFFF00>"
        - "&3&lServer name"
        - "&r&7&l>> %animation:Welcome%&3 &l%player%&7&l! &7&l<<"
        - "&r&7Online players: &f%online%"
        - "&6Online staff: &e%staffonline%"
        - ""
      footer:
        - "%animation:time%"
        - "&2Ping: %ping%"
        - "&7&l Used memory: %memory-used% MB / %memory-max% MB"
        - ""
        - "&r&7Visit our webpage %animation:web%"
        - "<#FFFFFF>&m                                                </#FFFF00>"

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Tablist-name-formatting
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Nametags
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  # https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Sorting-players-in-tablist
  sorting-types:
    - "GROUPS:owner,admin,mod,helper,builder,vip,default"
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Playerlist-Objective
playerlist-objective:
  enabled: true
  value: "%ping%"
  fancy-value: "&7Ping: %ping%"
  title: "HavocTab" # Only visible on Bedrock Edition
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Belowname
belowname-objective:
  enabled: false
  value: "%health%"
  fancy-value: "&c%health%"
  fancy-value-default: "NPC"
  title: "&cHealth"
  disable-condition: '%world%=disabledworld'
  view-distance: 10

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Spectator-fix
prevent-spectator-effect:
  enabled: false

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Bossbar
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: "PROGRESS" # for 1.9+: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
      color: "%animation:barcolors%" # for 1.9+: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
      progress: "100" # in %
      text: "&fWebsite: &bwww.domain.com"

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Scoreboard
scoreboard:
  enabled: false
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
    scoreboard-1.20.3+:
      title: "<#E0B11E>MyServer</#FF0000>"
      display-condition: "%player-version-id%>=765;%bedrock%=false" # Only display it to players using 1.20.3+ AND NOT bedrock edition
      lines:
        - "&7%date%"
        - "%animation:MyAnimation1%"
        - "&6Online:"
        - "* &eOnline&7:||%online%"
        - "* &eCurrent World&7:||%worldonline%"
        - "* &eStaff&7:||%staffonline%"
        - ""
        - "&6Personal Info:"
        - "* &bRank&7:||%group%"
        - "* &bPing&7:||%ping%&8ms"
        - "* &bWorld&7:||%world%"
        - "%animation:MyAnimation1%"
    scoreboard:
      title: "<#E0B11E>MyServer</#FF0000>"
      lines:
        - "&7%date%"
        - "%animation:MyAnimation1%"
        - "&6Online:"
        - "* &eOnline&7: &f%online%"
        - "* &eCurrent World&7: &f%worldonline%"
        - "* &eStaff&7: &f%staffonline%"
        - ""
        - "&6Personal Info:"
        - "* &bRank&7: &f%group%"
        - "* &bPing&7: &f%ping%&8ms"
        - "* &bWorld&7: &f%world%"
        - "%animation:MyAnimation1%"

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Layout
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:37e93c8e12cd426cb28fce31969e0674
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    default:
      slot-count: 80
      fixed-slots:
        - '1|&3Website&f:'
        - '2|&bmyserver.net'
        - '3|&8&m                       '
        - '4|&3Name&f:'
        - '5|&b%player%'
        - '7|&3Rank&f:'
        - '8|Rank: %group%'
        - '10|&3World&f:'
        - '11|&b%world%'
        - '13|&3Time&f:'
        - '14|&b%time%'
        - '21|&3Teamspeak&f:'
        - '22|&bts.myserver.net'
        - '23|&8&m                       '
        - '41|&3Store&f:'
        - '42|&bshop.myserver.net'
        - '43|&8&m                       '
      groups:
        staff:
          display-condition: permission:tab.staff
          slots:
            - 24-40
        players:
          slots:
            - 44-80

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Ping-Spoof
ping-spoof:
  enabled: false
  value: 0

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Global-playerlist
global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers:
    - spyserver1
    - spyserver2
  server-groups:
    lobbies:
      - lobby1
      - lobby2
    group2:
      - server1
      - server2

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "[HH:mm:ss / h:mm a]"
  time-offset: 0
  register-tab-expansion: false
  locale: en-US

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Placeholder-output-replacements
placeholder-output-replacements:
  "%essentials_vanished%":
    "yes": "&7| Vanished"
    "no": ""

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Conditional-placeholders
conditions:
  nick: # use it with %condition:nick%
    conditions:
      - "%player%=%essentials_nickname%"
    true: "%player%"
    false: "~%essentials_nickname%"

placeholder-refresh-intervals:
  default-refresh-interval: 500
  "%server_uptime%": 1000
  "%server_tps_1_colored%": 1000
  "%server_unique_joins%": 5000
  "%player_health%": 200
  "%player_ping%": 1000
  "%vault_prefix%": 1000
  "%rel_factionsuuid_relation_color%": 1000

# assigning groups by permission nodes instead of taking them from permission plugin
assign-groups-by-permissions: false

# if the option above is true, all groups are taken based on permissions and the one higher in this list is used as primary
# Warning! This is not sorting list and has nothing to do with sorting players in tablist!
primary-group-finding-list:
  - Owner
  - Admin
  - Mod
  - Helper
  - default

# Refresh interval (in milliseconds) of:
# - Permission checks in conditions / sorting
# - Group retrieving from permission plugin for sorting / per-group properties
permission-refresh-interval: 1000

# Unlocks extra console messages
debug: false

# https://github.com/NEZNAMY/TAB/wiki/MySQL
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
  useSSL: true

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Multi-server-support
proxy-support:
  enabled: true
  channel-name-suffix: "custom"
  # Supported types: PLUGIN, REDIS, RABBITMQ
  type: PLUGIN
  plugin:
    # Compatible plugins: RedisBungee
    # If enabled and compatible plugin is found, hook is enabled to work with proxied players
    name: RedisBungee
  redis:
    url: 'redis://:password@localhost:6379/0'
  rabbitmq:
    exchange: 'plugin'
    url: 'amqp://guest:guest@localhost:5672/%2F'

components:
  minimessage-support: true
  disable-shadow-for-heads: true

# Internal value, do not change this
config-version: 9

########################################################################
# BUKKIT ONLY - THE FOLLOWING SECTION IS ONLY FOR BACKEND INSTALLATION #
########################################################################

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Per-world-playerlist
per-world-playerlist:
  enabled: false
  # players with tab.staff will always see all players
  allow-bypass-permission: false
  # players in these worlds will always see all players
  ignore-effect-in-worlds:
    - ignoredworld
    - build
  shared-playerlist-world-groups:
    lobby:
      - lobby1
      - lobby2
    minigames:
      - paintball
      - bedwars

compensate-for-packetevents-bug: false

#####################################################################
#                       HAVOCTAB - CHAT                             #
#####################################################################
# HavocTab's chat module. Disabled by default - turn this on ONLY after
# disabling chat formatting in whatever plugin currently formats chat,
# otherwise both will format the same message.
#
# Every part of this is rendered PER VIEWER, which is what makes the
# toggles and blocking work without affecting anybody else.
#
# Placeholders you can use in format / hover / click:
#   %chatprefix%  %chatsuffix%  - set them per group in groups.yml
#   %player%  %message%  - and any other HavocTab or PlaceholderAPI placeholder
#
# Status placeholders this feature provides:
#   %havoctab_publicchat%   / %publicchat%   -> &aON / &cOFF
#   %havoctab_chatformat%   / %chatformat%   -> &aON / &cOFF
#   %havoctab_blocked%      / %blocked%      -> number of blocked players
chat:
  enabled: false

  # Set to false to keep the toggles and blocking but let another plugin format chat
  format-enabled: true

  # Shown to viewers with the chat format enabled
  format: "&f%chatprefix%%player%&#f40d0d: &f%message%"

  # Shown to viewers who ran the chat format toggle command
  plain-format: "&f%player%&7: &f%message%"

  hover:
    enabled: true
    # CHECK THESE AGAINST /papi list - they must be real placeholders on your server
    lore:
      - "%chatprefix%%player%"
      - "&#f40d0d&m----------"
      - "&#f40d0d&l$ &fᴍᴏɴᴇʏ &#f40d0d%vault_eco_balance_formatted%"
      - "&#f40d0d⚔ &fᴋɪʟʟѕ &#f40d0d%statistic_player_kills%"
      - "&#f40d0d⌚ &fᴘʟᴀʏᴛɪᴍᴇ &#f40d0d%statistic_time_played%"
      - "&#f40d0d☠ &fᴅᴇᴀᴛʜѕ &#f40d0d%statistic_deaths%"
      - "&#f40d0d★ &fʀᴜʙɪᴇѕ &#f40d0d%economy_shards%"
      - "&#f40d0d&m----------"
      - "&#f40d0dᴄʟɪᴄᴋ ᴛᴏ ᴠɪᴇᴡ ѕᴛᴀᴛѕ"

  # Command run when a player clicks a chat message. Leave empty to disable clicking.
  click-command: "/stats %player%"

  # Lets a player stop receiving public chat entirely, for themselves only
  public-chat:
    enabled: true
    toggle-command: "/publicchat"
    remember-toggle-choice: true
    hidden-by-default: false

  # Lets a player drop back to plain chat instead of the styled format
  chat-format:
    enabled: true
    toggle-command: "/chatformat"
    remember-toggle-choice: true
    hidden-by-default: false

  # /block and /ignore are the same command, as are /unblock and /unignore
  block:
    enabled: true
    block-commands: ["/block", "/ignore"]
    unblock-commands: ["/unblock", "/unignore"]
    list-commands: ["/blocklist", "/ignorelist"]
    # 0 for unlimited
    max-blocked: 100
    # How /blocklist is shown:
    #   AUTO   - native dialog for Java players, chest GUI for Bedrock (recommended)
    #   DIALOG - always the native dialog (Paper 1.21.6+; Bedrock players cannot see it)
    #   GUI    - always the chest GUI, works on every version and on Bedrock via Geyser
    #   CHAT   - clickable list printed into chat
    menu-type: AUTO
    # Also drop private messages from blocked players
    block-private-messages: true
    # Commands treated as private messages. Their first argument is checked against
    # the block list. Reply commands like /r cannot be checked - they carry no target.
    private-message-commands: ["msg", "tell", "w", "whisper", "pm", "m", "message", "emsg", "etell", "epm", "dm"]


#####################################################################
#                    HAVOCTAB - CLIENT-SIDE SETTINGS                #
#####################################################################
# Per-player display toggles. Everything here is CLIENT-SIDE: when a player
# turns something off, only THAT player stops seeing it. Nobody else on the
# server is affected and no ranks/permissions are changed server-side.
#
# Status placeholders (usable in header/footer, scoreboard, tablist, bossbar...):
#   %havoctab_ranks%      -> &aON / &cOFF
#   %ranks%               -> same, short alias
#   %havoctab_belowname%  -> &aON / &cOFF
#   %belowname%           -> same, short alias
client-display-settings:

  # Text the placeholders above return. Change these to restyle the ON/OFF text.
  placeholder-value-on: "&aON"
  placeholder-value-off: "&cOFF"

  # Lets a player hide rank prefixes/suffixes for themselves only.
  ranks:
    enabled: true
    toggle-command: "/ranks"
    # Save the choice in playerdata.yml and restore it when the player rejoins
    remember-toggle-choice: true
    # Start with ranks hidden for players who never used the command
    hidden-by-default: false
    # Hide tabprefix/tabsuffix in the tablist
    hide-tablist-prefix-suffix: true
    # Hide tagprefix/tagsuffix above player heads
    hide-nametag-prefix-suffix: true
    # Require the havoctab.ranks.toggle permission to use the command
    require-permission: false

  # Lets a player hide the belowname objective (the text/number under nametags,
  # including animated ones) for themselves only.
  belowname:
    enabled: true
    toggle-command: "/belowname"
    remember-toggle-choice: true
    hidden-by-default: false
    # Require the havoctab.belowname.toggle permission to use the command
    require-permission: false


#####################################################################
# PROXY ONLY - THE FOLLOWING SECTION IS ONLY FOR PROXY INSTALLATION #
#####################################################################

# Take permissions and groups from backend server instead of proxy
use-bukkit-permissions-manager: false

# Sometimes server might be using offline uuids in tablist instead of online, such as disabling waterfall's tablist rewrite option
# If you experience tablist formatting not working, toggle this option (set it to opposite value)
# Only affects proxies with online mode enabled
use-online-uuid-in-tablist: true