name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*", "[0-9]+.[0-9]+.[0-9]+*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build HavocTab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # HavocTab targets Java 8 bytecode but the build toolchain (and some
      # Minecraft 1.21+/26.x modules) require a modern JDK. 25 matches
      # `java.toolchain.languageVersion` in build-logic.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # `build` on the :jar module produces both shaded jars:
      #   jar/build/libs/HavocTab v<version>.jar
      #   jar/build/libs/HavocTab v<version> - Paper 1.20.5 - 1.21.4.jar
      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: List produced artifacts
        run: ls -lh jar/build/libs

      - name: Upload HavocTab jar
        uses: actions/upload-artifact@v4
        with:
          name: HavocTab
          path: |
            jar/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload API jar
        uses: actions/upload-artifact@v4
        with:
          name: HavocTab-API
          path: api/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

      # Tagging a commit (e.g. `git tag 6.1.2-havoc.1 && git push --tags`)
      # publishes the built jars as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: HavocTab ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            jar/build/libs/*.jar
